services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # keys are optional — without them the API serves the bundled snapshot
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      VAYUCAST_BOOT_INGEST: ${VAYUCAST_BOOT_INGEST:-1}
      VAYUCAST_REFRESH_MIN: "60"
      # Empty by default -> in-memory only. To turn on the Postgres mirror, start
      # with `docker compose --profile db up` and set DATABASE_URL in your .env, e.g.
      #   DATABASE_URL=postgresql+psycopg://vayucast:vayucast@db:5432/vayucast
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - vayucast-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional Postgres mirror. Off unless you pass `--profile db`.
  #   docker compose --profile db up
  db:
    image: postgres:18-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vayucast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayucast}
      POSTGRES_DB: ${POSTGRES_DB:-vayucast}
    volumes:
      - vayucast-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayucast}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vayucast-data:
  vayucast-pg:
