[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vayucast"
version = "0.1.0"
description = "Air Pollution-Weather Coupled Forecasting System for Delhi NCR (SIH 2026 PS 26082)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VayuCast Team" }]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "duckdb>=0.10",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
model = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.44",
]
dl = [
    "torch>=2.2",
    "lightning>=2.2",
    "pytorch-forecasting>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "httpx>=0.27",
]
# Historical pressure-level meteorology from ARCO-ERA5 (keyless Zarr on GCS).
era5 = [
    "xarray>=2024.1",
    "zarr>=2.17",
    "gcsfs>=2024.2",
    "dask>=2024.1",
]
# Optional Copernicus CDS / GRIB path. Default ingest needs none of this.
gridded = [
    "xarray>=2024.1",
    "cfgrib>=0.9.11",
    "netCDF4>=1.6",
    "cdsapi>=0.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "ingest*", "features*", "aqi*", "models*", "api*"]
exclude = ["tests*", "web*", "wrfchem*", "notebooks*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
